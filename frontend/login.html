<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoolPune – log in or sign up</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head><body>
<div class="auth" id="auth" data-role="rider">
  <aside class="brand">
    <a class="logo" href="login.html">PoolPune</a>
    <div>
      <h2 id="pitchTitle"></h2>
      <ul id="pitchList"></ul>
    </div>
    <svg viewBox="0 0 320 110" aria-hidden="true"><path d="M20 80 C90 10, 150 110, 210 50 S290 30 300 30" fill="none" stroke="#6b7c93" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="20" cy="80" r="9" fill="#6ea0ff"/><circle cx="300" cy="30" r="9" fill="#ff7aa8"/><rect x="132" y="48" width="22" height="22" rx="6" fill="#ffb340"/></svg>
  </aside>
  <main class="panelwrap">
    <div class="card">
      <div class="seg" role="tablist" aria-label="Account type" id="roleSeg">
        <button type="button" role="tab" data-role="rider">I'm a rider</button>
        <button type="button" role="tab" data-role="driver">I'm a driver</button>
      </div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="seg slim" role="tablist" aria-label="Log in or sign up" id="modeSeg">
        <button type="button" role="tab" data-mode="login">Log in</button>
        <button type="button" role="tab" data-mode="signup">Sign up</button>
      </div>
      <div id="alert" role="alert" hidden></div>
      <form id="form" novalidate></form>
      <p class="switch" id="switch"></p>
    </div>
  </main>
</div>
<script src="js/auth.js"></script>
</body></html>
