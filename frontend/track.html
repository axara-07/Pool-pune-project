<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PoolPune – live trip</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head><body>
<header><h1>PoolPune <span class="tag">Live trip</span></h1><p id="who">Loading…</p></header>
<main class="tmain">
<section class="panel" id="info" aria-live="polite"></section>
<section class="panel"><div id="map" role="img" aria-label="Map showing the car and the route"></div><p class="note">Position updates every few seconds. The car is shown at the last stop the driver confirmed.</p></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/track.js"></script>
</body></html>
