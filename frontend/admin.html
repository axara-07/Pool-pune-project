<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PoolPune – safety team</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">

</head><body>
<header><h1>PoolPune <span class="tag">Safety team</span></h1><p>SOS alerts, missed check-ins and reports. Open alerts are shown first and refresh every few seconds.</p></header>
<main class="dmain">
<section class="panel full" id="gate"><label for="key">Safety-team key (printed in the server console when it starts)</label><div class="row"><input id="key" type="password" autocomplete="off"><button id="enter">Open console</button></div><p id="gmsg" class="note bad" role="alert"></p></section>
<section class="panel full" id="list" hidden></section>
</main>
<script src="js/admin.js"></script>
</body></html>
